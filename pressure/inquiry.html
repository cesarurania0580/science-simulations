<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crack the Pressure Code</title>
<!--
  Deep Dive · Crack the Pressure Code (Cesar, 2026-11-03). Grade 10 inquiry activity.
  One offline file, no network, no libraries. Self-paced: 7 short missions in which
  students discover P = P_air + rho g h without being told it.
  Progress is kept in sessionStorage only (it survives an accidental reload, and is
  wiped when the tab is closed). No names are asked for.
-->
<style>
  :root {
    --bg: #04111f; --card: #0f2542; --card2: #12305a; --line: #1f3d63;
    --ink: #e6f1ff; --muted: #8fb0d4; --accent: #22d3ee; --accent-soft: rgba(34,211,238,.14);
    --gold: #facc15; --good: #4ade80; --bad: #f87171; --violet: #a78bfa; --orange: #fb923c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 430px; height: 100vh; }
  .stage { position: relative; overflow: hidden; min-height: 0; user-select: none; -webkit-user-select: none; }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .glass { background: rgba(4,17,31,.6); border: 1px solid rgba(148,197,255,.22); backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px); border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }

  /* HUD */
  .hud-top { position: absolute; top: 12px; left: 76px; right: 240px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  .chip { padding: 8px 14px; font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .instruments { position: absolute; top: 12px; right: 12px; width: 214px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .readout { width: 100%; display: flex; align-items: baseline; gap: 6px; background: rgba(0,0,0,.35); border-radius: 10px; padding: 6px 10px; }
  .readout label { font-size: .62rem; letter-spacing: .1em; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .digits { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 1.5rem; font-weight: 700;
    color: #67e8f9; text-shadow: 0 0 12px rgba(34,211,238,.6); margin-left: auto; }
  .readout .u { color: var(--muted); font-weight: 700; font-size: .85rem; min-width: 30px; }
  .readout.p .digits { color: #fde68a; text-shadow: 0 0 12px rgba(250,204,21,.55); }
  #dial { width: 150px; height: 150px; display: block; }
  .zone { width: 100%; text-align: center; font-size: .78rem; font-weight: 800; padding: 6px 8px; border-radius: 10px; background: rgba(0,0,0,.35); }
  .hull { width: 100%; height: 8px; border-radius: 5px; background: rgba(255,255,255,.12); overflow: hidden; }
  .hull i { display: block; height: 100%; width: 0; background: var(--good); transition: background .3s; }

  .controls { position: absolute; left: 78px; bottom: 16px; display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 54px); gap: 6px; }
  .ctl { border-radius: 50%; border: 2px solid rgba(103,232,249,.6); background: rgba(4,17,31,.6); font-size: 1.2rem;
    cursor: pointer; color: #a5f3fc; box-shadow: 0 0 18px rgba(34,211,238,.2); touch-action: none; }
  .ctl.held { background: var(--accent); color: #04111f; }
  #upBtn { grid-column: 2; grid-row: 1; } #leftBtn { grid-column: 1; grid-row: 2; }
  #downBtn { grid-column: 2; grid-row: 2; } #rightBtn { grid-column: 3; grid-row: 2; }
  .tankmode #leftBtn, .tankmode #rightBtn { visibility: hidden; }
  .record { position: absolute; right: 18px; bottom: 18px; border: 0; border-radius: 999px; padding: 16px 24px; font-weight: 800;
    font-size: 1.05rem; cursor: pointer; color: #1a1300; background: linear-gradient(135deg, #fde047, #f59e0b);
    box-shadow: 0 6px 24px rgba(245,158,11,.45); }
  .record:active { transform: scale(.97); }
  kbd { font-family: ui-monospace, Menlo, monospace; font-size: .75em; padding: 1px 6px; border-radius: 5px; background: rgba(0,0,0,.2); border: 1px solid rgba(127,127,127,.4); }
  .toast { position: absolute; left: 50%; top: 70px; transform: translate(-50%, -10px); opacity: 0; transition: opacity .25s, transform .25s;
    padding: 10px 18px; font-weight: 700; pointer-events: none; max-width: min(70%, 520px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.good { border-color: rgba(74,222,128,.7); color: #bbf7d0; }
  .toast.warn { border-color: rgba(251,191,36,.8); color: #fde68a; }
  .toast.danger { border-color: rgba(248,113,113,.9); color: #fecaca; background: rgba(69,10,10,.75); }
  .timer { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); padding: 8px 20px; font-size: 1.6rem; font-weight: 800;
    font-family: ui-monospace, Menlo, monospace; color: #fde68a; }
  .timer.low { color: #fca5a5; animation: pulse 1s infinite; }
  .signal { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-weight: 800; }
  @keyframes pulse { 50% { opacity: .55; } }
  .tankbar { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; justify-content: center; max-width: 46%; }
  .tankbar button { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-weight: 700; font-size: .82rem; }
  .tankbar button.on { background: var(--accent); color: #04111f; border-color: var(--accent); }
  .tankbar button .ok { color: var(--good); }

  /* Panel */
  .panel { overflow-y: auto; background: linear-gradient(180deg, #0a1b30, #071426); border-left: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h2 { margin: 0 0 10px; font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .mmap { display: flex; gap: 6px; justify-content: space-between; }
  .mbtn { flex: 1; aspect-ratio: 1; max-width: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); cursor: pointer;
    font-size: 1.2rem; position: relative; padding: 0; }
  .mbtn small { position: absolute; bottom: 1px; right: 4px; font-size: .62rem; font-weight: 800; color: var(--muted); }
  .mbtn.done { border-color: var(--good); background: rgba(74,222,128,.12); }
  .mbtn.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .mbtn:disabled { opacity: .35; cursor: not-allowed; filter: grayscale(1); }
  .mtitle { margin-top: 10px; font-weight: 800; font-size: 1.1rem; }
  .board { border-color: rgba(250,204,21,.45); background: linear-gradient(180deg, rgba(250,204,21,.08), var(--card)); }
  .board h2 { color: var(--gold); }
  .formula { font-size: 1.15rem; font-weight: 800; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; padding: 6px 0; }
  .slot { min-width: 44px; padding: 6px 10px; border-radius: 10px; border: 2px dashed rgba(250,204,21,.5); color: rgba(250,204,21,.7); text-align: center; }
  .slot.on { border-style: solid; border-color: var(--gold); background: rgba(250,204,21,.15); color: #fff; animation: pop .5s; }
  .slot.word { font-size: .72rem; padding: 6px 7px; min-width: 0; }
  .formula { gap: 4px; }
  .board.cracked .formula { font-size: 1.5rem; }
  @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .clues { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .clue { font-size: .8rem; color: #e2e8f0; background: rgba(0,0,0,.25); border-radius: 8px; padding: 5px 8px; }
  .stephead { display: flex; align-items: center; gap: 10px; font-size: .74rem; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .bar { flex: 1; height: 6px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .txt { font-size: .95rem; line-height: 1.5; }
  .txt p { margin: 0 0 8px; } .txt ul { margin: 0 0 8px; padding-left: 20px; }
  .tag { display: inline-block; font-size: .74rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); margin-bottom: 6px; }
  .tag.pred { background: rgba(167,139,250,.18); color: var(--violet); }
  .tag.task { background: rgba(250,204,21,.15); color: var(--gold); }
  .q { font-size: 1.16rem; line-height: 1.45; font-weight: 700; margin-bottom: 12px; }
  .look { margin: 4px 0 12px; background: rgba(0,0,0,.25); border: 1px solid rgba(250,204,21,.55); border-radius: 10px; padding: 8px; }
  .lookhead { font-size: .76rem; font-weight: 800; color: var(--gold); margin-bottom: 6px; letter-spacing: .04em; }
  .look canvas { width: 100%; height: 200px; display: block; }
  .look .tablewrap { max-height: 190px; margin: 0; }
  .hints { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .hintbox { background: rgba(250,204,21,.1); border: 1px solid rgba(250,204,21,.45); border-radius: 10px; padding: 8px 10px; font-size: .92rem; line-height: 1.45; }
  .hintbtn { margin-top: 8px; }
  .part { display: inline-block; font-size: .74rem; font-weight: 800; letter-spacing: .06em; padding: 4px 10px; border-radius: 999px; background: rgba(251,146,60,.18); color: var(--orange); margin-bottom: 8px; }
  .plan { margin: 6px 0 10px; padding-left: 22px; } .plan li { margin: 5px 0; }
  .who { float: right; color: var(--ink); text-transform: none; letter-spacing: 0; font-size: .8rem; }
  .opts { display: flex; flex-direction: column; gap: 6px; }
  .opt { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 9px 12px; cursor: pointer; font-size: .9rem; }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt svg { flex: none; }
  .opt.sel { border-color: var(--violet); background: rgba(167,139,250,.18); }
  .opt.right { border-color: var(--good); background: rgba(74,222,128,.15); }
  .opt.wrong { border-color: var(--bad); background: rgba(248,113,113,.1); opacity: .6; }
  .fb { margin-top: 10px; font-size: .9rem; line-height: 1.45; }
  .fb .good, .fb .bad, .fb .info { border-radius: 10px; padding: 10px 12px; }
  .fb .good { background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.5); }
  .fb .bad { background: rgba(248,113,113,.1); border: 1px solid rgba(248,113,113,.5); }
  .fb .info { background: rgba(167,139,250,.12); border: 1px solid rgba(167,139,250,.5); }
  .eqbox { margin: 8px 0; padding: 8px; text-align: center; font-weight: 800; font-size: 1.05rem; border-radius: 10px; background: rgba(250,204,21,.12); border: 1px solid rgba(250,204,21,.4); }
  .numrow { display: flex; gap: 8px; align-items: center; }
  .numrow input { flex: 1; min-width: 0; background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 1rem; text-align: right; }
  .prog { margin-top: 8px; font-family: ui-monospace, Menlo, monospace; font-size: .86rem; color: #fde68a; background: rgba(0,0,0,.25); border-radius: 8px; padding: 6px 10px; }
  .btn { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: .88rem; font-weight: 700; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #04111f; border-color: var(--accent); }
  .btn.big { width: 100%; margin-top: 10px; padding: 11px; font-size: 1rem; }
  .builder .slots { display: flex; gap: 6px; align-items: center; justify-content: center; font-weight: 800; font-size: 1.1rem; margin: 10px 0; flex-wrap: wrap; }
  .builder .bslot { min-width: 54px; min-height: 44px; border: 2px dashed var(--muted); border-radius: 10px; background: rgba(0,0,0,.25); cursor: pointer; font-weight: 800; }
  .builder .bslot.filled { border-style: solid; border-color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tile { border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 8px 4px; cursor: pointer; text-align: center; font-size: .8rem; }
  .tile b { display: block; font-size: 1.15rem; }
  .tile:disabled { opacity: .3; cursor: default; }
  .tablewrap { max-height: 220px; overflow-y: auto; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: .86rem; }
  th, td { padding: 6px 9px; text-align: right; border-bottom: 1px solid var(--line); }
  th { position: sticky; top: 0; background: var(--card2); font-size: .72rem; color: var(--muted); }
  th:first-child, td:first-child { text-align: left; }
  td.del button { border: 0; background: none; color: var(--muted); cursor: pointer; }
  tr.new td { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(250,204,21,.35); } to { background: transparent; } }
  .empty { padding: 16px; text-align: center !important; color: var(--muted); }
  #graph { width: 100%; height: 230px; display: block; background: rgba(0,0,0,.25); border-radius: 10px; }
  .foot { display: flex; gap: 8px; flex-wrap: wrap; }
  .foot a { color: var(--accent); font-size: .85rem; align-self: center; margin-left: auto; }

  /* Notebook */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; z-index: 10; }
  .modal[hidden] { display: none; }
  .sheet { background: #fff; color: #1e293b; max-width: 760px; width: 100%; border-radius: 14px; padding: 24px 28px; }
  .sheet h1 { margin: 0 0 4px; font-size: 1.5rem; } .sheet h3 { margin: 18px 0 6px; color: #0e7490; }
  .sheet .meta { color: #64748b; font-size: .9rem; }
  .sheet .qa { margin: 4px 0; font-size: .92rem; } .sheet .qa i { color: #475569; }
  .sheet table { font-size: .85rem; margin: 6px 0; max-width: 460px; }
  .sheet th { background: #f1f5f9; color: #334155; position: static; } .sheet td, .sheet th { border-bottom: 1px solid #e2e8f0; }
  .sheet .clue { background: #fef9c3; color: #1e293b; }
  .sheet .lines { border-bottom: 1px solid #94a3b8; height: 28px; }
  .sheetbtns { display: flex; gap: 8px; justify-content: flex-end; margin-bottom: 10px; }
  .sheetbtns .btn { color: #1e293b; background: #e2e8f0; border-color: #cbd5e1; }

  .welcome label { display: block; margin: 12px 0; font-weight: 700; }
  .welcome input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font-size: 1.05rem; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: #1e293b; }
  .welcome .err { color: #dc2626; font-weight: 700; min-height: 1.2em; }
  .welcome .btn.primary { color: #04111f; }
  @media print {
    @page { margin: 14mm; }
    html, body { background: #fff !important; height: auto !important; overflow: visible !important; }
    .app, #welcome { display: none !important; }
    #notebook { position: static !important; display: block !important; background: #fff !important; padding: 0 !important; overflow: visible !important; }
    #notebook .sheet { max-width: none; width: auto; border-radius: 0; padding: 0; }
    .sheetbtns { display: none !important; }
    .sheet h3 { break-after: avoid; } .sheet table, .sheet .qa { break-inside: avoid; }
    .sheet .clue { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .stage { height: 70vh; min-height: 460px; }
    .panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    .hud-top { left: 66px; right: 170px; top: 8px; }
    .instruments { width: 156px; top: 8px; right: 8px; padding: 8px; gap: 6px; }
    #dial { width: 104px; height: 104px; }
    .digits { font-size: 1.1rem; }
    .readout label { display: none; }
    .controls { left: 68px; bottom: 10px; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(2, 46px); }
    .record { right: 10px; bottom: 12px; padding: 12px 16px; font-size: .9rem; }
    .record kbd { display: none; }
    .tankbar { bottom: 120px; max-width: 70%; }
    .toast { top: auto; bottom: 130px; max-width: 80%; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="scene" aria-label="Underwater game scene"></canvas>
    <div class="hud-top"><div class="chip glass" id="chip"></div></div>

    <div class="instruments glass">
      <div class="readout"><label>DEPTH</label><span class="digits" id="depthOut">0.0</span><span class="u">m</span></div>
      <canvas id="dial" aria-hidden="true"></canvas>
      <div class="readout p"><label id="pLabel">PRESSURE</label><span class="digits" id="pOut">0</span><span class="u">kPa</span></div>
      <div class="zone" id="zone"></div>
      <div class="hull" id="hullBar" hidden><i></i></div>
    </div>

    <div class="controls" id="controls">
      <button type="button" class="ctl" id="upBtn" aria-label="Up">▲</button>
      <button type="button" class="ctl" id="leftBtn" aria-label="Left">◀</button>
      <button type="button" class="ctl" id="downBtn" aria-label="Down">▼</button>
      <button type="button" class="ctl" id="rightBtn" aria-label="Right">▶</button>
    </div>
    <div class="tankbar glass" id="tankbar" hidden></div>
    <button type="button" class="record" id="recordBtn">📍 Record <kbd>Space</kbd></button>
    <div class="timer glass" id="timer" hidden></div>
    <div class="signal glass" id="signal" hidden></div>
    <div class="toast glass" id="toast" role="status"></div>
  </div>

  <aside class="panel">
    <section class="card">
      <h2>Missions <span class="who" id="who"></span></h2>
      <div class="mmap" id="mmap"></div>
      <div class="mtitle" id="mtitle"></div>
    </section>
    <section class="card board" id="board"></section>
    <section class="card" id="stepCard" aria-live="polite"></section>
    <section class="card" id="dataCard" hidden>
      <h2 id="dataTitle">Data</h2>
      <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
      <canvas id="graph"></canvas>
    </section>
    <div class="foot">
      <button type="button" class="btn" id="nbBtn">📓 My lab notebook</button>
      <a href="index.html" target="_blank" rel="noopener">Free lab ↗</a>
    </div>
  </aside>
</div>

<div class="modal" id="welcome" hidden>
  <div class="sheet welcome">
    <h1>🤿 Welcome, diver!</h1>
    <p>Before you start, type your name. It will appear in your lab notebook.</p>
    <label>Your name <input id="nameIn" autocomplete="off" maxlength="40"></label>
    <label>Class (optional) <input id="classIn" autocomplete="off" maxlength="20"></label>
    <div class="err" id="nameErr"></div>
    <button type="button" class="btn primary big" id="nameGo">Start the missions ▶</button>
    <p class="meta">Your name stays only in this browser tab. It is deleted when you close the tab.</p>
  </div>
</div>

<div class="modal" id="notebook" hidden>
  <div class="sheet">
    <div class="sheetbtns"><button type="button" class="btn" id="printBtn">🖨 Print / save as PDF</button><button type="button" class="btn" id="nbClose">Close</button></div>
    <div id="nbBody"></div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   Physics and settings
   ===================================================================== */
const OCEAN = { rho: 1025, g: 9.81, patm: 101.3 };
const LIQUIDS = [
  { name: "Oil", rho: 800, col: "#e8b923" },
  { name: "Water", rho: 1000, col: "#2a9fd6" },
  { name: "Salt brine", rho: 1200, col: "#14b8a6" },
  { name: "Honey", rho: 1400, col: "#c2620c" },
];
const PLANETS = [
  { name: "Moon", g: 1.62, patm: 0, sky: ["#000000", "#1e1b2e"], ground: "#9ca3af", stars: true },
  { name: "Mars", g: 3.71, patm: 0.6, sky: ["#7c2d12", "#fdba74"], ground: "#b45309" },
  { name: "Earth", g: 9.81, patm: 101.3, sky: ["#38bdf8", "#e0f2fe"], ground: "#4d7c0f" },
  { name: "Super-Earth", g: 19.62, patm: 150, sky: ["#4c1d95", "#f0abfc"], ground: "#57534e", madeUp: true },
];
const HUMAN_LIMIT = 60;       // m: hard stop for the human diver
const SPEED = { diver: 5, probe: 3, drone: 45 };

// Human danger zones (depth in m)
const ZONES = [
  { to: 18, col: "#4ade80", name: "🟢 Safe zone for beginner divers" },
  { to: 30, col: "#facc15", name: "🟡 Advanced divers only" },
  { to: 40, col: "#fb923c", name: "🟠 Deep: risk of nitrogen narcosis" },
  { to: 60.01, col: "#ef4444", name: "🔴 DANGER: deeper than the 40 m limit" },
];
const ZONE_MSG = [
  "",
  "🟡 Below 18 m: only advanced divers go this deep.",
  "🟠 Below 30 m: the high pressure makes nitrogen in the air act like a drug. Divers get confused (nitrogen narcosis).",
  "🔴 DANGER! Below 40 m, the limit for divers breathing normal air. Go back up!",
];
const OCEAN_ZONES = [
  { to: 200, name: "☀️ Sunlight zone" }, { to: 1000, name: "🌒 Twilight zone" }, { to: 1e9, name: "🌑 Midnight zone" },

function bed(x) {
  if (x <= BED[0][0]) return BED[0][1];
  for (let i = 1; i < BED.length; i++) {
    const [x1, d1] = BED[i];
    if (x <= x1) { const [x0, d0] = BED[i - 1]; return d0 + (d1 - d0) * (x - x0) / (x1 - x0); }
  }
  return BED[BED.length - 1][1];
}
function inPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

  let A = 0;
  for (let i = 0; i < poly.length; i++) { const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length]; A += x0 * y1 - x1 * y0; }

    const len = Math.hypot(x1 - x0, d1 - d0), n = Math.max(1, Math.ceil(len / .55));

  const box = { x0: Math.min(...xs), x1: Math.max(...xs), d0: Math.min(...ds), d1: Math.max(...ds) };

/* =====================================================================

   ===================================================================== */
function blocked(x, d) {
  if (S.map === "tank") return false;
  if (x < X_MIN || x > X_MAX) return true;
  const pts = S.vehicle === "drone" ? [[0, 0], [1, 0], [-1, 0], [0, .5], [0, -.4]] : [[0, 0], [.5, 0], [-.5, 0], [0, .3], [0, -.3]];
  for (const [ox, od] of pts) {
    const px = x + ox, pd = d + od;
    if (pd > bed(px) - .25) return true;
    for (const r of ROCKS) if (inPoly(px, pd, r)) return true;
  }
  return false;
}

  if (S.map === "tank") return 11.6;

}

let t = 0, breath = 0;
function update(dt) {
  const sp = SPEED[S.map === "tank" ? "probe" : S.vehicle] * (S.keys.fine ? (S.vehicle === "drone" ? .06 : .12) : 1);

  let iy = (S.keys.down || S.hold.down) - (S.keys.up || S.hold.up);
  if (S.map === "tank") ix = 0;
  let wx = 0, wd = 0;
  if (S.crushed > 0) { /* no control while crushed */ }
  else if (ix || iy) {
    S.target = null;
    const n = Math.hypot(ix, iy); wx = ix / n * sp; wd = iy / n * sp;
  } else if (S.target) {
    const dx = S.target.x - S.pos.x, dd = S.target.d - S.pos.d, dist = Math.hypot(dx, dd);
    const v = Math.min(sp, dist * 2.2);
    if (dist > 0.01) { wx = dx / dist * v; wd = dd / dist * v; }
    if (dist < 0.02 && !dragging) S.target = null;

    magnets(dt);
  }
  S.vel.x += (wx - S.vel.x) * Math.min(1, dt * 6);
  S.vel.d += (wd - S.vel.d) * Math.min(1, dt * 6);
  if (Math.abs(S.vel.x) > .2) S.facing = Math.sign(S.vel.x);

  const nx = S.map === "tank" ? 0 : S.pos.x + S.vel.x * dt;
  let nd = S.pos.d + S.vel.d * dt;
  const md = maxDepth();
  if (nd > md) {
    nd = md; S.vel.d = 0;
    if (S.vehicle === "diver" && S.map === "ocean") {
      if (!S.flags.hitLimit) toast("⛔ STOP! Too deep for a human diver. The pressure here is about 7 times the surface pressure.", "danger", 4000);
      S.flags.hitLimit = true;
    }
  }
  if (nd < 0) { nd = 0; S.vel.d = Math.max(0, S.vel.d); }
  if (!blocked(nx, S.pos.d)) S.pos.x = nx; else S.vel.x = 0;
  if (!blocked(S.pos.x, nd)) S.pos.d = nd; else S.vel.d = 0;

  const viewTarget = S.map === "tank" ? 16 : S.vehicle === "drone" ? 60 : 16;
  S.view += (viewTarget - S.view) * Math.min(1, dt * 2);

  for (const c of clouds) { c.x += 1.5 * dt; if (c.x > 540) c.x = -80; }

function magnets(dt) {

  if (M().stations) for (const s of STATIONS) if (Math.abs(S.pos.x - s.x) < 2.6 && Math.abs(S.pos.d - s.d) < 1.6) goal = s;

  if (S.crushed) return;
  const h = round1(S.pos.d), p = pShown(h);

    if (S.data.some(r => r.h === h)) { toast(`You already recorded ${h.toFixed(1)} m. Try a new depth!`, "warn"); return; }
    row = { h, p };
  } else if (m.data === "stations") {
    const s = STATIONS.find(s => Math.abs(S.pos.x - s.x) < 1.2 && Math.abs(S.pos.d - s.d) < .3);
    if (!s) { toast("Swim into a glowing station ring first, then record.", "warn"); return; }

      const g = ctx.createLinearGradient(0, ySurf, 0, sy(35));

/* visual floor: the collision floor outline, pushed in and out along its normal with noise,

const BED_VIS = (() => {
  const out = [];
  for (let i = 1; i < BED.length; i++) {
    const [x0, d0] = BED[i - 1], [x1, d1] = BED[i];
    const len = Math.hypot(x1 - x0, d1 - d0), ex = (x1 - x0) / len, ed = (d1 - d0) / len;
    const n = Math.max(1, Math.ceil(len / (Math.max(d0, d1) > 60 ? 1.5 : .5)));
    for (let j = 0; j < n; j++) { const f = j / n; out.push({ x: x0 + (x1 - x0) * f, d: d0 + (d1 - d0) * f, nx: ed, nd: -ex }); }
  }
  const [lx, ld] = BED[BED.length - 1]; out.push({ x: lx, d: ld, nx: 0, nd: -1 });
  let arc = 0;
  out.forEach((q, i) => {
    if (i) arc += Math.hypot(q.x - out[i - 1].x, q.d - out[i - 1].d);
    const amp = .3 + clamp((q.d - 50) * .01, 0, 4), disp = fbm(arc * .12) * amp + noise1(arc * .7 + 3) * amp * .35;
    q.vx = q.x + q.nx * disp; q.vd = q.d + q.nd * disp;

  const stepX = Math.max(.4, 5 / P);
  let i0 = 0, i1 = BED_VIS.length - 1;
  while (i0 < i1 && BED_VIS[i0].x < x0 - 15) i0++;
  while (i1 > i0 && BED_VIS[i1].x > x1 + 15) i1--;
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(sx(BED_VIS[i0].vx), H + 50);
  for (let i = i0; i <= i1; i++) ctx.lineTo(sx(BED_VIS[i].vx), sy(BED_VIS[i].vd));
  ctx.lineTo(sx(BED_VIS[i1].vx), H + 50); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();

  ctx.strokeStyle = "rgba(120,95,60,.25)"; ctx.lineWidth = 1.5;
  for (let k = 1; k <= 3; k++) {

  tg.addColorStop(0, "rgba(70,60,52,0)"); tg.addColorStop(1, "rgba(45,38,33,1)");
  ctx.fillStyle = tg; ctx.fillRect(0, sy(55), W, Math.max(0, H + 60 - sy(55)));

  ctx.strokeStyle = "rgba(15,12,10,.45)"; ctx.lineWidth = Math.max(1, P * .05);
  for (let i = i0; i <= i1; i += 6) {

function drawGraphOn(graph, gctx) {

    const n = pts.length, sxv = pts.reduce((a, p) => a + p[0], 0), syv = pts.reduce((a, p) => a + p[1], 0);
    const sxx = pts.reduce((a, p) => a + p[0] * p[0], 0), sxy = pts.reduce((a, p) => a + p[0] * p[1], 0), den = n * sxx - sxv * sxv;

    }
  }

}

    if (S.ui.locked) return;
    const fb = $("#fb"), sl = S.ui.slots;
    if (sl.includes(null)) { fb.innerHTML = `<div class="bad">Fill all 3 boxes first.</div>`; return; }
    const wrong = sl.find(k => !["rho", "g", "h"].includes(k));
    const formula = sl.map(k => BUILD_TILES.find(t => t.k === k).sym).join(" × ");
    if (!wrong) {
      S.ui.locked = true; note("m6build", "Build the formula for the extra pressure", `P_gauge = ${formula}`, true);
      fb.innerHTML = `<div class="good">✅ Yes! Depth (Mission 2), density (Mission 4) and gravity (Mission 5).<div class="eqbox">P<sub>gauge</sub> = ρ g h</div>(The order of the letters doesn't matter when you multiply.)</div>${continueBtn()}`;
      wireContinue();
    } else {
      note("m6build", "Build the formula for the extra pressure", `P_gauge = ${formula}`, false);
      fb.innerHTML = `<div class="bad">❌ Check <b>${BUILD_TILES.find(t => t.k === wrong).sym}</b> (${BUILD_TILES.find(t => t.k === wrong).name}). ${BUILD_TILES.find(t => t.k === wrong).why}</div>`;
    }
  });
}
function refreshBuilder() { const fbHTML = $("#fb")?.innerHTML || ""; renderStep(); $("#fb").innerHTML = fbHTML; }

/* rescue (Mission 7). The probe is chosen when the mission starts; Part C calculates its depth first. */
function rescueHTML() {
  const r = S.rescue, d = r.probe.d.toFixed(0);
  if (r.result === "win") return `<span class="tag task">⏱ Rescue</span><div class="fb"><div class="good">🎉 Probe rescued with ${Math.ceil(r.left)} s left! It was at ${d} m, just as you calculated.</div></div>${continueBtn()}`;
  if (r.running) return `<span class="tag task">⏱ Rescue in progress</span><div class="txt"><p>1. Dive straight down to about <b>${d} m</b>.</p><p>2. Follow the 📡 signal at the top of the screen (east or west).</p><p>3. Touch the orange probe 🟠 to rescue it.</p></div>`;
  return `<span class="tag task">⏱ Rescue</span>
    <div class="txt"><p>You calculated that the probe 🟠 is at about <b>${d} m</b>.</p>
    <p>When you press <b>Start</b>, you have <b>90 seconds</b>: dive to ${d} m with your drone 🟡, then follow the 📡 signal (east or west) until you touch the probe.</p></div>
    ${r.result === "fail" ? `<div class="fb"><div class="bad">⏰ Time's up! The probe is still waiting in the same place. Try again: go straight down to ${d} m first, then follow the signal.</div></div>` : ""}
    <button type="button" class="btn primary big" id="rgo">▶ Start the 90 s rescue</button>`;
}
function newRescue() {
  const P = [1500, 2000, 2500, 3000, 3500, 4000][Math.floor(Math.random() * 6)];
  const d = (P - OCEAN.patm) * 1000 / (OCEAN.rho * OCEAN.g);
  S.rescue = { probe: { P, d, x: rnd(300, 390) }, left: 90, running: false, result: null };
}
function wireRescue() {
  if (S.rescue.result === "win") { wireContinue(); return; }
  $("#rgo")?.addEventListener("click", () => {
    if (S.rescue.running) return;
    Object.assign(S.rescue, { running: true, left: 90, result: null });
    place([282, 0]); renderStep(); toast("⏱ Go! Dive down and follow the signal.", "warn");
  });
}
function endRescue(win) {
  const r = S.rescue; r.running = false; $("#timer").hidden = true; $("#signal").hidden = true;
  if (win) {
    r.result = "win"; note("m7rescue", "Timed rescue", `Found the probe at ${r.probe.d.toFixed(0)} m (${r.probe.P} kPa)`, true);
    celebrate(); toast("🎉 Probe rescued!", "good");
  } else {
    r.result = "fail"; place([282, 0]);
    toast("⏰ Time's up! Your drone is back at the surface. Try again.", "danger", 4000);
  }
  renderStep();
}

/* =====================================================================
   Notebook
   ===================================================================== */
function openNotebook() {
  const nb = $("#nbBody");
  const esc = v => String(v || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let html = `<h1>📓 Lab notebook: Crack the Pressure Code</h1><p class="meta">Name: <b>${esc(S.save.name) || "______________________"}</b> &nbsp; Class: <b>${esc(S.save.cls) || "________"}</b> &nbsp; Date: ${new Date().toLocaleDateString()}</p>`;
  html += `<h3>The code I found</h3><p style="font-size:1.2rem;font-weight:800">${S.save.clues.includes("code") ? "P = P<sub>air</sub> + ρ g h" : "Not cracked yet: keep going!"}</p>`;
  html += S.save.clues.length ? `<div class="clues">${CLUES.filter(c => S.save.clues.includes(c.k)).map(c => `<div class="clue">${c.icon} ${c.text}</div>`).join("")}</div>` : "";
  for (const m of MISSIONS) {
    const n = S.save.notes[m.id]; if (!n || !Object.keys(n.qa).length) continue;
    html += `<h3>${m.icon} Mission ${m.id}: ${m.title} ${S.save.done.includes(m.id) ? "✅" : "(not finished)"}</h3>`;
    for (const k in n.qa) {
      const e = n.qa[k];
      const tag = e.correct === null ? "🔮 Prediction" : e.correct ? (e.tries > 1 ? `✅ (after ${e.tries} tries)` : "✅") : "❌ (not solved yet)";
      html += `<p class="qa"><i>${e.q}</i><br><b>${e.a}</b> ${tag}</p>`;
    }
    if (n.table && n.table.rows.length) html += `<table><thead><tr>${n.table.cols.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${n.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  }
  html += `<h3>✍️ Reflection</h3><p class="qa">1. Which of your predictions was wrong? What did you learn from it?</p><div class="lines"></div><div class="lines"></div>
    <p class="qa">2. Explain in your own words why a submarine needs a stronger hull to go deeper.</p><div class="lines"></div><div class="lines"></div>`;
  nb.innerHTML = html;
  $("#notebook").hidden = false;
}
$("#nbBtn").addEventListener("click", openNotebook);
$("#nbClose").addEventListener("click", () => { $("#notebook").hidden = true; });
$("#printBtn").addEventListener("click", () => window.print());

/* name prompt */
function showWho() { $("#who").textContent = S.save.name ? `🤿 ${S.save.name}` : ""; }
function askName() {
  $("#welcome").hidden = false;
  $("#nameIn").value = S.save.name || ""; $("#classIn").value = S.save.cls || "";
  setTimeout(() => $("#nameIn").focus(), 50);
}
function saveName() {
  const n = $("#nameIn").value.trim();
  if (!n) { $("#nameErr").textContent = "Please type your name."; $("#nameIn").focus(); return; }
  S.save.name = n; S.save.cls = $("#classIn").value.trim(); persist();
  $("#welcome").hidden = true; showWho();
}
$("#nameGo").addEventListener("click", saveName);
["#nameIn", "#classIn"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") saveName(); }));
$("#who").addEventListener("click", askName);

/* =====================================================================
   Go
   ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  update(dt);
  if (W && H) drawScene();
  updateHud();
  requestAnimationFrame(frame);
}
restore();
resize();
startMission(Math.max(0, Math.min(MISSIONS.length - 1, S.save.unlocked - 1)));
showWho();
if (!S.save.name) askName();
requestAnimationFrame(frame);
</script>
