      return `<div class="bar-slot" style="--color:${colors[i%colors.length]}"><div id="bar-${i}" class="bar ${good?'good':''} ${box.neg?'neg':''}" style="bottom:${box.bottom}%;height:${box.height}%"><div id="handle-${i}" class="bar-handle" role="slider" tabindex="0" data-drag="${i}" aria-label="${t('dragBar')} ${i+1}" aria-orientation="vertical" aria-valuemin="${ax.lo}" aria-valuemax="${ax.hi}" aria-valuenow="${v}" aria-valuetext="${fmt(v)} ${u}" aria-describedby="drag-help"></div></div></div>`;
    }).join('');
    const cards=tg.map((x,i)=>{
      const good=barCorrect(g.heights[i],x.value),empty=g.heights[i]==null||g.heights[i]==='';
      const hint=good?'correct':empty?'placeBar':Number(g.heights[i])<x.value?'higher':'lower';
      const mark=g.checked[i]?`<span class="status ${good?'ok':'retry'}">${good?'✓':'↕'} ${t(hint)}</span>`:'';
      return `<div class="bar-card" style="--color:${colors[i%colors.length]}"><strong>${x.title}</strong>${x.when?`<span class="when">${x.when}</span>`:''}<div class="target-value">${key==='acceleration'?x.value.toFixed(2):fmt(x.value)} <small>${u}</small></div><button class="small" data-action="check-bar" data-index="${i}" aria-label="${t('checkBar')} ${i+1}">${t('checkBar')}</button><div id="bar-status-${i}">${mark}</div></div>`;
    }).join('');
    const tabs=state.mode==='rocket'?`<div class="graph-tabs"><button class="secondary ${key==='height'?'active':''}" data-action="pick" data-graph="height">${t('heightGraph')}</button><button class="secondary ${key==='velocity'?'active':''}" data-action="pick" data-graph="velocity">${t('velocityGraph')}</button></div>`:'';
    let question='';
    if(graphComplete()&&key!=='acceleration'){
      const b=best(),ok=g.answerChecked&&Number(g.answer)===b,x=tg[b];
      const answer=key==='height'?fill(t('a_height'),{t:x.label,v:fmt(x.value)}):fill(t(`a_${key}`),{i:b+1,v:fmt(x.value),t1:fmtTime(x.t1),t2:fmtTime(x.t2)});
      question=`<div class="question"><strong>❓ ${t(`q_${key}`)}</strong><div class="row"><select id="answer" class="wide"><option value="">${t('chooseOne')}</option>${tg.map((y,i)=>`<option value="${i}" ${String(g.answer)===String(i)?'selected':''}>${key==='height'?`${y.label} s`:`${y.title} (${y.when})`}</option>`).join('')}</select><button class="small" data-action="check-answer">${t('checkAnswer')}</button></div>${g.answerChecked?`<div class="notice ${ok?'success':'error'}">${ok?answer:t('a_wrong')}</div>`:''}<p><strong>💭 ${t(`think_${key}`)}</strong></p></div>`;
    }
    const negNote=ax.lo<0?`<p class="muted">${t(key==='acceleration'?'accelNegative':'negNote')}</p>`:'';
    return `${tabs}<h2>${t(key==='acceleration'?'accelGraphTitle':'graph')}</h2><p>${t(key==='acceleration'?'accelGraphIntro':'graphIntro')}</p><label><strong>${t('scale')} (${u})</strong> <input type="number" id="scale" min="0" step="any" value="${esc(g.scale??niceTop())}"></label><p class="muted">${t('scaleHelp')}</p>${tooSmall()?`<div class="notice error">${t('scaleError')}</div>`:''}${notice()}<div class="graph-workspace"><div class="chart-frame"><div class="y-axis-title">${yTitle}</div><div class="graph-area"><div class="chart" role="group" aria-label="${t('graph')}"><div class="ylabels">${Array.from({length:ticks+1},(_,i)=>`<span style="bottom:${i/ticks*100}%">${Number((ax.lo+i*ax.step).toPrecision(10))}</span>`).join('')}</div><div class="plot" style="--grid-step:${100/ticks}%">${ax.lo<0?`<div class="zero-line" style="bottom:${z}%"></div>`:''}${bars}</div><div class="xlabels">${tg.map(x=>`<span>${x.label}</span>`).join('')}</div></div></div></div><p class="axis-title">${xTitle}</p>${negNote}<p class="muted" id="drag-help">${t('keyboardHelp')}</p><div class="bar-inputs"><h3>${t(key==='acceleration'?'accelCards':'cards')}</h3>${cards}</div></div>${question}${key==='acceleration'&&graphComplete()?`<div class="question"><strong>${t('accelThink')}</strong></div>`:''}${showNavigation?navigation({action:key==='acceleration'?'accel':'back-results',label:key==='acceleration'?'navAccel':state.mode==='runner'?'navResults':'navRocketResults'},{action:'check-graph',label:'checkGraph'},key==='speed'?{action:'accel',label:'navAccel'}:{action:'finish',label:'finish',disabled:!graphComplete()}):''}${showNavigation&&key!=='speed'&&!graphComplete()?`<p class="muted">${t('finishHint')}</p>`:''}${showNavigation?toolsView():''}`;
  }
  function setBarHeight(index,value){
    const g=G(),ax=axis();
    g.heights[index]=String(Math.max(ax.lo,Math.min(ax.hi,graphKey()==='acceleration'?Number(value.toFixed(2)):roundSig(value))));
    g.checked[index]=false;g.answerChecked=false;state.message='';
    const h=Number(g.heights[index]),box=barBox(h,ax),bar=$(`#bar-${index}`),handle=$(`#handle-${index}`);
    bar.style.bottom=`${box.bottom}%`;bar.style.height=`${box.height}%`;bar.classList.toggle('neg',box.neg);bar.classList.remove('good');
    handle.setAttribute('aria-valuenow',h);handle.setAttribute('aria-valuetext',`${fmt(h)} ${unit()}`);
    $(`#bar-status-${index}`).textContent='';
    const finish=$('[data-action="finish"]');if(finish)finish.disabled=true;
    $('#app [role="status"]')?.remove();
  }
  let drag=null;
  $('#app').addEventListener('pointerdown',e=>{
    const handle=e.target.closest('[data-drag]');if(!handle||e.button!==0||drag)return;
    e.preventDefault();const index=Number(handle.dataset.drag);handle.focus();handle.setPointerCapture(e.pointerId);
    drag={index,id:e.pointerId,y:e.clientY,height:Number(G().heights[index])||0,pixels:$('.plot').clientHeight,handle};
    setBarHeight(index,drag.height);
  });
  $('#app').addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){e.preventDefault();const ax=axis();setBarHeight(drag.index,drag.height+(drag.y-e.clientY)/drag.pixels*(ax.hi-ax.lo));}});
  function finishDrag(e){if(!drag||e.pointerId!==drag.id)return;const {index,handle,id}=drag;drag=null;if(handle.hasPointerCapture(id))handle.releasePointerCapture(id);render();$(`#handle-${index}`)?.focus({preventScroll:true});}
  $('#app').addEventListener('pointerup',finishDrag);
  $('#app').addEventListener('pointercancel',finishDrag);
  $('#app').addEventListener('lostpointercapture',finishDrag);
  $('#app').addEventListener('keydown',e=>{
    const handle=e.target.closest('[data-drag]');if(!handle||!['ArrowUp','ArrowRight','ArrowDown','ArrowLeft','Home','End'].includes(e.key))return;
    e.preventDefault();const i=Number(handle.dataset.drag),ax=axis(),current=Number(G().heights[i])||0,step=(ax.hi-ax.lo)/100;
    const next=e.key==='Home'?ax.lo:e.key==='End'?ax.hi:current+(['ArrowUp','ArrowRight'].includes(e.key)?step:-step);
    setBarHeight(i,next);
  });
  function setMessage(key,kind='error',vars={}){state.message=fill(t(key),vars);state.kind=kind;render();}
  // Spread `count` indices across the run; for a rocket the highest point is always kept.
  function pick(n,count,must){
    if(n<=count)return Array.from({length:n},(_,i)=>i);
    const idx=Array.from({length:count},(_,i)=>Math.round(i*(n-1)/(count-1)));
    if(must!=null&&!idx.includes(must)){let near=1;for(let k=1;k<idx.length-1;k++)if(Math.abs(idx[k]-must)<Math.abs(idx[near]-must))near=k;idx[near]=must;idx.sort((a,b)=>a-b);}
    return idx;
  }
  function parseCSV(text,count){
    const lines=text.replace(/^﻿/,'').split(/\r?\n/);
    const header=lines.findIndex(line=>/^\s*"?Time \(s\)"?\s*,/i.test(line));if(header<0)throw Error('header');
    const cols=lines[header].split(',').map(c=>c.trim().replace(/"/g,''));
    const col=cols.findIndex(c=>new RegExp(`^${state.mode==='runner'?'X':'Y'} \\(m\\)$`,'i').test(c));if(col<0)throw Error(state.mode==='rocket'?'noY':'header');
    const all=[];for(let i=header+1;i<lines.length;i++){const line=lines[i].trim();if(!line||/Velocity Data/i.test(line))break;const cells=line.split(',');if(cells.length<=col)break;const time=Number(cells[0].trim()),v=Number(cells[col].trim());if(!Number.isFinite(time)||!Number.isFinite(v))throw Error('value');all.push({t:String(time),v:String(v)});}
    if(all.length<LIMITS[state.mode][0])throw Error('count');
    const must=state.mode==='rocket'?all.reduce((b,q,i)=>Number(q.v)>Number(all[b].v)?i:b,0):null;
    return {rows:pick(all.length,count,must).map(i=>all[i]),total:all.length};
  }
  function resetGraphs(){state.finished=false;state.restartPending=false;state.resultsKey=null;state.g={};state.graphType=null;state.accelAnswers=[];state.accelChecked=false;}
  const demos={
    runner:[[0,0],[1.1,3],[1.8,6],[2.4,9],[2.95,12],[3.48,15],[4,18],[4.53,21],[5.08,24],[5.66,27]],
    big:Array.from({length:11},(_,i)=>[i,2.5*i*i]),
    water:Array.from({length:11},(_,i)=>{const s=Number((i*0.4).toFixed(1));return [s,Number(Math.max(0,20*s-4.9*s*s).toFixed(2))];})
  };
  $('#language').addEventListener('click',()=>{hideToast();state.lang=state.lang==='es'?'en':'es';state.message='';render();});
  $('#app').addEventListener('input',e=>{if(e.target.id==='student-name'){state.name=e.target.value.slice(0,32);return;}const field=e.target.dataset.field,index=Number(e.target.dataset.index);if(field==='delta'||field==='accel'){
      state.accelAnswers[index]??={};state.accelAnswers[index][field]=e.target.value;state.accelChecked=false;
      e.target.removeAttribute('aria-invalid');const next=$('[data-action="accel-graph"]');if(next)next.disabled=true;
      $('#accel-feedback')?.remove();return;
    }if(field==='t'||field==='v')state.rows[index][field]=e.target.value;});
  $('#app').addEventListener('change',async e=>{
    if(e.target.id==='csv'&&e.target.files?.[0]){try{const {rows,total}=parseCSV(await e.target.files[0].text(),Number($('#sample-count').value));state.rows=rows;resetGraphs();setMessage('imported','success',{used:rows.length,total});}catch(err){const [mn,mx]=LIMITS[state.mode];if(err.message==='noY')setMessage('noY');else if(err.message==='count')setMessage('needPoints','error',{min:mn,max:mx});else setMessage('fileError');}}
    if(e.target.id==='scale'){const n=Number(e.target.value);G().scale=n>0?n:null;state.message='';render();}
    if(e.target.id==='answer'){const g=G();g.answer=e.target.value;g.answerChecked=false;render();}
  });
  $('#app').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const action=button.dataset.action,previousStage=state.stage,wasFinished=state.finished;
    if(action==='finish'&&graphComplete()){state.finished=true;state.message='';render();}
    else if(action==='review-graph'){state.finished=false;render();}
    else if(action==='restart'){state.restartPending=true;render();}
    else if(action==='cancel-restart'){state.restartPending=false;render();}
    else if(action==='accel'){state.stage=4;state.message='';render();}
    else if(action==='speed-graph'){state.stage=3;state.message='';render();}
    else if(action==='check-accel'){state.accelChecked=true;render();encourage(accelerationComplete());return;}
    else if(action==='accel-graph'&&accelerationComplete()){state.stage=5;state.message='';const g=G();if(g.scale==null)g.scale=niceTop();render();}
    else if(action==='mode'){if(state.mode!==button.dataset.mode){state.mode=button.dataset.mode;state.rows=blankRows();resetGraphs();}state.stage=1;state.message='';render();}
    else if(action==='back-choose'){state.stage=0;state.message='';render();}
    else if(action==='demo'){state.rows=demos[button.dataset.demo].map(([a,b])=>({t:String(a),v:String(b)}));resetGraphs();state.message='';render();}
    else if(action==='add'&&state.rows.length<LIMITS[state.mode][1]){state.rows.push({t:'',v:''});state.message='';render();}
    else if(action==='remove'&&state.rows.length>LIMITS[state.mode][0]){state.rows.splice(Number(button.dataset.index),1);state.message='';render();}
    else if(action==='results'){const err=validate();if(err){const [mn,mx]=LIMITS[state.mode];setMessage(err,'error',{min:mn,max:mx});}else{const key=JSON.stringify([state.mode,points()]);if(state.resultsKey!==key){resetGraphs();state.resultsKey=key;}state.stage=2;state.message='';render();}}
    else if(action==='back'){state.stage=1;state.message='';render();}
    else if(action==='graph'){state.stage=3;state.message='';if(state.mode==='runner'){const g=G();if(g.scale==null)g.scale=niceTop();}render();}
    else if(action==='pick'){state.graphType=button.dataset.graph;const g=G();if(g.scale==null)g.scale=niceTop();state.message='';render();}
    else if(action==='back-results'){state.stage=2;state.message='';render();}
    else if(action==='check-bar'){G().checked[Number(button.dataset.index)]=true;if(graphComplete())setMessage(graphKey()==='acceleration'?'accelGraphGood':'graphGood','success');else{state.message='';render();}}
    else if(action==='check-graph'){const g=G();g.checked=targets().map(()=>true);const good=graphComplete();setMessage(good?(graphKey()==='acceleration'?'accelGraphGood':'graphGood'):'graphTry',good?'success':'error');}
    else if(action==='check-answer'){const g=G();g.answerChecked=true;state.message='';render();}
    else if(action==='print')window.print();
    else if(action==='confirm-restart'&&state.restartPending){state.stage=0;state.mode=null;state.rows=blankRows();resetGraphs();state.message='';render();}
    if(action==='check-graph')encourage(state.kind==='success');
    else if(action==='check-bar'){const i=Number(button.dataset.index),x=targets()[i],h=G().heights[i],good=barCorrect(h,x.value),empty=h==null||h==='';encourage(good,good?'':t(empty?'placeBar':Number(h)<x.value?'higher':'lower'));}
    else if(action==='check-answer'){const g=G();encourage(g.answer!==''&&Number(g.answer)===best());}
    else hideToast();
    if(state.stage!==previousStage||state.finished!==wasFinished){const heading=$('#app h2');heading?.setAttribute('tabindex','-1');heading?.focus();heading?.scrollIntoView?.({block:'start'});}
  });
  render();
})();
</script>
</body>
</html>
