    if(must!=null&&!idx.includes(must)){let near=1;for(let k=1;k<idx.length-1;k++)if(Math.abs(idx[k]-must)<Math.abs(idx[near]-must))near=k;idx[near]=must;idx.sort((a,b)=>a-b);}
    return idx;
  }
  // PhysTracker "motion_data" CSV: Time (s), X (m), Y (m), … then a Velocity Data block we ignore.
  function parseCSV(text){
    const lines=text.replace(/^﻿/,'').split(/\r?\n/);
    const header=lines.findIndex(line=>/^\s*"?Time \(s\)"?\s*,/i.test(line));if(header<0)throw Error('header');
    const cols=lines[header].split(',').map(c=>c.trim().replace(/"/g,''));
    const col=cols.findIndex(c=>new RegExp(`^${state.mode==='runner'?'X':'Y'} \\(m\\)$`,'i').test(c));if(col<0)throw Error(state.mode==='rocket'?'noY':'header');
    const all=[];for(let i=header+1;i<lines.length;i++){const line=lines[i].trim();if(!line||/Velocity Data/i.test(line))break;const cells=line.split(',');if(cells.length<=col)break;const time=Number(cells[0].trim()),v=Number(cells[col].trim());if(!Number.isFinite(time)||!Number.isFinite(v))throw Error('value');all.push({t:String(Number(time.toFixed(tdec()))),v:String(Number(v.toFixed(2)))});}
    all.sort((p,q)=>Number(p.t)-Number(q.t));
    for(let i=all.length-1;i>0;i--)if(ticks(all[i].t)-ticks(all[i-1].t)<1)all.splice(i,1);
    if(all.length<LIMITS[state.mode][0])throw Error('count');
    const must=state.mode==='rocket'?all.reduce((b,q,i)=>Number(q.v)>Number(all[b].v)?i:b,0):null;
    return {rows:pick(all.length,LIMITS[state.mode][1],must).map(i=>({...all[i]})),total:all.length};
  }
  function resetGraphs(){state.finished=false;state.restartPending=false;state.resultsKey=null;state.g={};state.graphType=null;state.calc=blankCalc();}
  const accelGoodKey = () => copy[state.lang][`accelGraphGood_${state.mode}`]?`accelGraphGood_${state.mode}`:'accelGraphGood';
  // A coloured picture of the checked graph, with each bar's value written on it.
  function graphCanvas(){
    const key=graphKey(),tg=targets(),ax=axis(),W=1400,H=900,L=150,R=W-50,T=150,B=H-150;
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const font=(w,px)=>`${w} ${px}px system-ui, -apple-system, "Segoe UI", sans-serif`;
    const Y=v=>B-(v-ax.lo)/(ax.hi-ax.lo)*(B-T);
    x.fillStyle='#ffffff';x.fillRect(0,0,W,H);x.fillStyle='#193348';x.textAlign='center';x.textBaseline='alphabetic';
    x.font=font(800,36);x.fillText(t(`img_${key}`),W/2,60);
    x.font=font(500,22);x.fillStyle='#526b79';x.fillText([state.name.trim(),t(`${state.mode}Title`).replace(/^\S+\s/,''),new Date().toLocaleDateString(state.lang)].filter(Boolean).join('  ·  '),W/2,98);
    const ticks=Math.round((ax.hi-ax.lo)/ax.step);
    x.textAlign='right';x.textBaseline='middle';x.font=font(500,20);
    for(let i=0;i<=ticks;i++){const v=Number((ax.lo+i*ax.step).toPrecision(10)),y=Y(v);x.strokeStyle='#dce7ec';x.lineWidth=1;x.beginPath();x.moveTo(L,y);x.lineTo(R,y);x.stroke();x.fillStyle='#193348';x.fillText(String(v),L-12,y);}
    const slot=(R-L)/tg.length,bw=Math.min(slot*.62,96),valuePx=Math.max(14,Math.min(24,slot/3.4));
    tg.forEach((b,i)=>{
      const cx=L+slot*(i+.5),top=Y(Math.max(b.value,0)),bottom=Y(Math.min(b.value,0));
      x.fillStyle=colors[i%colors.length];x.fillRect(cx-bw/2,top,bw,bottom-top);x.strokeStyle='#193348';x.lineWidth=2;x.strokeRect(cx-bw/2,top,bw,bottom-top);
      x.fillStyle='#193348';x.textAlign='center';x.font=font(800,valuePx);
      if(b.value>=0){x.textBaseline='bottom';x.fillText(fmtValue(key,b.value),cx,top-6);}else{x.textBaseline='top';x.fillText(fmtValue(key,b.value),cx,bottom+6);}
      x.font=font(700,Math.min(20,valuePx));x.textBaseline='top';x.fillText(b.label,cx,B+12);
    });
    x.strokeStyle='#193348';x.lineWidth=3;x.beginPath();x.moveTo(L,T);x.lineTo(L,B);x.lineTo(R,B);x.stroke();
    if(ax.lo<0){x.beginPath();x.moveTo(L,Y(0));x.lineTo(R,Y(0));x.stroke();}
    const yTitle=key==='acceleration'?t('axisAcceleration'):key==='speed'?t('axisSpeed'):key==='height'?t('axisHeight'):t('axisVelocity'),xTitle=key==='acceleration'?t('axisAccelTime'):key==='height'?t('axisTime'):t('axisInterval');
    x.font=font(800,24);x.textAlign='center';x.textBaseline='alphabetic';x.fillText(xTitle,(L+R)/2,B+82);
    x.save();x.translate(48,(T+B)/2);x.rotate(-Math.PI/2);x.fillText(yTitle,0,0);x.restore();
    x.font=font(500,16);x.fillStyle='#8397a3';x.textAlign='right';x.fillText('PhysTracker for Kids · '+t('title'),R,H-22);
    return c;
  }
  function downloadGraph(){
    const slug=state.name.trim().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
    graphCanvas().toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${slug?slug+'-':''}${graphKey()}-graph.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);},'image/png');
  }
  const demos={
    runner:[[0,0],[1.1,3],[1.8,6],[2.4,9],[2.95,12],[3.48,15],[4,18],[4.53,21],[5.08,24],[5.66,27]],
    big:Array.from({length:11},(_,i)=>[i,2.5*i*i]),
    water:Array.from({length:11},(_,i)=>{const s=Number((i*0.4).toFixed(1));return [s,Number(Math.max(0,20*s-4.9*s*s).toFixed(2))];})
  };
  $('#language').addEventListener('click',()=>{hideToast();state.lang=state.lang==='es'?'en':'es';state.message='';render();});
  $('#app').addEventListener('input',e=>{if(e.target.id==='student-name'){state.name=e.target.value.slice(0,32);return;}const field=e.target.dataset.field,index=Number(e.target.dataset.index),kind=e.target.dataset.calc;if(kind){
      const c=state.calc[kind];c.answers[index]??={};c.answers[index][field]=e.target.value;c.checked=false;
      e.target.removeAttribute('aria-invalid');e.target.parentElement.querySelector('.status')?.remove();
      const next=$(`[data-action="${kind==='speed'?'graph':'accel-graph'}"]`);if(next)next.disabled=true;
      $(`#${kind}-feedback`)?.remove();return;
    }if(field==='t'||field==='v')state.rows[index][field]=e.target.value;});
  $('#app').addEventListener('change',async e=>{
    if(e.target.id==='csv'&&e.target.files?.[0]){try{const {rows,total}=parseCSV(await e.target.files[0].text());state.rows=rows;resetGraphs();setMessage('imported','success',{used:rows.length,total});}catch(err){const [mn,mx]=LIMITS[state.mode];if(err.message==='noY')setMessage('noY');else if(err.message==='count')setMessage('needPoints','error',{min:mn,max:mx});else setMessage('fileError');}}
    if(e.target.id==='scale'){const n=Number(e.target.value);G().scale=n>0?n:null;state.message='';render();}
    if(e.target.id==='answer'){const g=G();g.answer=e.target.value;g.answerChecked=false;render();}
  });
  $('#app').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button)return;const action=button.dataset.action,previousStage=state.stage,wasFinished=state.finished;
    if(action==='finish'&&graphComplete()){state.finished=true;state.message='';render();}
    else if(action==='review-graph'){state.finished=false;render();}
    else if(action==='restart'){state.restartPending=true;render();}
    else if(action==='cancel-restart'){state.restartPending=false;render();}
    else if(action==='accel'){state.stage=4;state.message='';render();}
    else if(action==='speed-graph'){state.stage=3;state.message='';render();}
    else if(action==='check-calc'){const kind=button.dataset.kind;state.calc[kind].checked=true;render();encourage(firstDone(kind));return;}
    else if(action==='fill-rest'){const kind=button.dataset.kind;if(firstDone(kind))fillRest(kind);render();$(`#${kind}-feedback`)?.focus?.();}
    else if(action==='download'){downloadGraph();}
    else if(action==='accel-graph'&&calcReady('accel')){state.stage=5;state.message='';const g=G();if(g.scale==null)g.scale=niceTop();render();}
    else if(action==='mode'){if(state.mode!==button.dataset.mode){state.mode=button.dataset.mode;state.rows=blankRows();resetGraphs();}state.stage=1;state.message='';render();}
    else if(action==='back-choose'){state.stage=0;state.message='';render();}
    else if(action==='demo'){state.rows=demos[button.dataset.demo].map(([a,b])=>({t:String(a),v:String(b)}));resetGraphs();state.message='';render();}
    else if(action==='add'&&state.rows.length<LIMITS[state.mode][1]){state.rows.push({t:'',v:''});state.message='';render();}
    else if(action==='remove'&&state.rows.length>LIMITS[state.mode][0]){state.rows.splice(Number(button.dataset.index),1);state.message='';render();}
    else if(action==='results'){const err=validate();if(err){const [mn,mx]=LIMITS[state.mode];setMessage(err,'error',{min:mn,max:mx,a:badPoint,b:badPoint+1,gap:tgap().toFixed(tdec())});}else{const key=JSON.stringify([state.mode,points()]);if(state.resultsKey!==key){resetGraphs();state.resultsKey=key;}state.stage=2;state.message='';render();}}
    else if(action==='back'){state.stage=1;state.message='';render();}
    else if(action==='graph'&&calcReady('speed')){state.stage=3;state.message='';const g=G();if(g.scale==null)g.scale=niceTop();render();}
    else if(action==='back-results'){state.stage=2;state.message='';render();}
    else if(action==='check-bar'){G().checked[Number(button.dataset.index)]=true;if(graphComplete())setMessage(graphKey()==='acceleration'?accelGoodKey():'graphGood','success');else{state.message='';render();}}
    else if(action==='check-graph'){const g=G();g.checked=targets().map(()=>true);const good=graphComplete();setMessage(good?(graphKey()==='acceleration'?accelGoodKey():'graphGood'):'graphTry',good?'success':'error');}
    else if(action==='check-answer'){const g=G();g.answerChecked=true;state.message='';render();}
    else if(action==='print')window.print();
    else if(action==='confirm-restart'&&state.restartPending){state.stage=0;state.mode=null;state.rows=blankRows();resetGraphs();state.message='';render();}
    if(action==='check-graph')encourage(state.kind==='success');
    else if(action==='check-bar'){const i=Number(button.dataset.index),x=targets()[i],h=G().heights[i],good=barCorrect(h,x.value),empty=h==null||h==='';encourage(good,good?'':t(empty?'placeBar':Number(h)<x.value?'higher':'lower'));}
    else if(action==='check-answer'){const g=G();encourage(g.answer!==''&&Number(g.answer)===best());}
    else hideToast();
    if(state.stage!==previousStage||state.finished!==wasFinished){const heading=$('#app h2');heading?.setAttribute('tabindex','-1');heading?.focus();heading?.scrollIntoView?.({block:'start'});}
  });
  // ── Pocket calculator: floating, draggable, separate from #app so re-renders never reset it.
  Object.assign(copy.en,{calcName:'Calculator',calcClose:'Close calculator',calcError:'Error'});
  Object.assign(copy.es,{calcName:'Calculadora',calcClose:'Cerrar calculadora',calcError:'Error'});
  const calc={tokens:[],cur:'',done:false,expr:''};
  const SYM={'+':'+','-':'−','*':'×','/':'÷'};
  const calcFormat = n => {if(!Number.isFinite(n))return t('calcError');const r=Number(n.toPrecision(10));return Math.abs(r)>=1e12||(r!==0&&Math.abs(r)<1e-9)?r.toExponential(4):String(r);};
  // × and ÷ before + and −, like a scientific calculator; no eval().
  function calcEvaluate(tokens){
    const sum=[];let term=tokens[0];
    for(let i=1;i<tokens.length;i+=2){const op=tokens[i],n=tokens[i+1];if(op==='*')term*=n;else if(op==='/')term=n===0?NaN:term/n;else{sum.push(term,op);term=n;}}
    sum.push(term);let total=sum[0];for(let i=1;i<sum.length;i+=2)total=sum[i]==='+'?total+sum[i+1]:total-sum[i+1];return total;
  }
  // A negative number after an operation is written in brackets, as on paper: 12.4 − (−3).
  const numText = (text,first) => {const m=text.replace(/^-/,'−');return !first&&m.startsWith('−')?`(${m})`:m;};
  const tokensText = tokens => tokens.map((x,i)=>typeof x==='number'?numText(calcFormat(x),i===0):SYM[x]).join(' ');
  function calcPress(key){
    const c=calc;
    if(/^[0-9]$/.test(key)){if(c.done){c.cur='';c.expr='';c.done=false;}if(c.cur.replace(/[-.]/g,'').length>=12)return;c.cur=c.cur==='0'?key:c.cur==='-0'?'-'+key:c.cur+key;}
    else if(key==='.'){if(c.done){c.cur='';c.expr='';c.done=false;}if(!c.cur.includes('.'))c.cur=(c.cur===''||c.cur==='-'?c.cur+'0':c.cur)+'.';}
    else if(key==='neg'){c.done=false;c.cur=c.cur.startsWith('-')?c.cur.slice(1):'-'+(c.cur||'0');}
    else if(key in SYM){
      if(c.done){c.done=false;c.expr='';}
      if(c.cur===''||c.cur==='-'){if(typeof c.tokens.at(-1)==='string')c.tokens[c.tokens.length-1]=key;else if(c.tokens.length)c.tokens.push(key);else c.tokens.push(0,key);}
      else{const n=Number(c.cur);if(!Number.isFinite(n))return calcPress('C');c.tokens.push(n,key);c.cur='';}
    }
    else if(key==='='){
      const tk=[...c.tokens];if(c.cur!==''&&c.cur!=='-')tk.push(Number(c.cur));if(typeof tk.at(-1)==='string')tk.pop();if(!tk.length)return;
      const r=calcEvaluate(tk);c.expr=`${tokensText(tk)} =`;c.tokens=[];c.cur=Number.isFinite(r)?String(Number(r.toPrecision(10))):'';c.done=true;if(!Number.isFinite(r))c.err=true;
    }
    else if(key==='C'){c.tokens=[];c.cur='';c.expr='';c.done=false;}
    else if(key==='Backspace'){if(c.done){c.cur='';c.expr='';c.done=false;}else c.cur=c.cur.slice(0,-1);}
    calcShow();
  }
  // While typing, the big line shows the whole calculation ("6 + 4"); after =, the answer is big and the calculation sits above it.
  function calcShow(){
    const c=calc,err=c.err;c.err=false;
    const typing=[tokensText(c.tokens),c.cur&&numText(c.cur,!c.tokens.length)].filter(Boolean).join(' ');
    const big=err?t('calcError'):c.done?(c.cur===''?'0':c.cur.replace(/^-/,'−')):typing||'0';
    $('#calc-expr').textContent=c.done||err?c.expr:'';
    const value=$('#calc-value');value.textContent=big;
    value.style.fontSize=big.length>18?'1.05rem':big.length>12?'1.35rem':'';
  }
  function calcLabels(){
    $('#calc-title').textContent=t('calcName');$('#calc-toggle').setAttribute('title',t('calcName'));$('#calc-toggle').setAttribute('aria-label',t('calcName'));$('#calc-close').setAttribute('aria-label',t('calcClose'));
  }
  const calcStore={get(){try{return JSON.parse(localStorage.getItem('mgl-calc-pos'));}catch{return null;}},set(v){try{localStorage.setItem('mgl-calc-pos',JSON.stringify(v));}catch{}}};
  function calcPlace(left,top){
    const box=$('#calc'),w=box.offsetWidth||264,h=box.offsetHeight||380,W=window.innerWidth,H=window.innerHeight;
    left=Math.max(4,Math.min(W-w-4,left));top=Math.max(4,Math.min(H-h-4,top));
    Object.assign(box.style,{left:`${left}px`,top:`${top}px`,bottom:'auto'});return {left,top};
  }
  function calcOpen(open){
    const box=$('#calc');box.hidden=!open;$('#calc-toggle').setAttribute('aria-expanded',String(open));
    if(open){const pos=calcStore.get();if(pos)calcPlace(pos.left,pos.top);box.focus({preventScroll:true});}else $('#calc-toggle').focus();
  }
  if(typeof window!=='undefined'&&window.addEventListener){
    $('#calc-toggle').addEventListener('click',()=>calcOpen($('#calc').hidden));
    $('#calc-close').addEventListener('click',()=>calcOpen(false));
    $('#calc-keys').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(!b)return;calcPress(b.dataset.key);if(e.detail>0)$('#calc').focus({preventScroll:true});});
    $('#calc').addEventListener('keydown',e=>{
      if(e.target.closest('button')&&(e.key==='Enter'||e.key===' '))return; // the button's own click handles it
      const map={'Enter':'=','=':'=','x':'*','X':'*',',':'.','Delete':'C','c':'C','C':'C'};const key=map[e.key]??e.key;
      if(e.key==='Escape'){e.preventDefault();calcOpen(false);return;}
      if(/^[0-9]$/.test(key)||['.','+','-','*','/','=','C','Backspace'].includes(key)){e.preventDefault();calcPress(key);}
    });
    let cdrag=null;
    $('#calc-bar').addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button!==0)return;const r=$('#calc').getBoundingClientRect();cdrag={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top};$('#calc-bar').setPointerCapture(e.pointerId);e.preventDefault();});
    $('#calc-bar').addEventListener('pointermove',e=>{if(cdrag&&e.pointerId===cdrag.id)calcPlace(e.clientX-cdrag.dx,e.clientY-cdrag.dy);});
    const endDrag=e=>{if(!cdrag||e.pointerId!==cdrag.id)return;cdrag=null;const r=$('#calc').getBoundingClientRect();calcStore.set({left:r.left,top:r.top});};
    $('#calc-bar').addEventListener('pointerup',endDrag);$('#calc-bar').addEventListener('pointercancel',endDrag);
    window.addEventListener('resize',()=>{if(!$('#calc').hidden){const r=$('#calc').getBoundingClientRect();calcPlace(r.left,r.top);}});
  }
  render();
})();
